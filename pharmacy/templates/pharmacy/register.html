<!DOCTYPE html>
<html>
<head>
    <title>Register - Highway Medico</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f7f0;
            display: flex;
            justify-content: center;
            padding-top: 60px;
            margin: 0;
        }
        .box {
            background: white;
            padding: 30px;
            border-radius: 15px;
            width: 360px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }
        .box h2 {
            color: #1a5e1a;
            margin-bottom: 5px;
        }
        .box p {
            color: #666;
            font-size: 14px;
        }
        .box input {
            width: 90%;
            padding: 12px;
            margin: 8px 0;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 15px;
            outline: none;
        }
        .box input:focus {
            border-color: #1a5e1a;
        }
        .box button {
            width: 97%;
            padding: 12px;
            background: #1a5e1a;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .box button:hover {
            background: #144a14;
        }
        .link {
            margin-top: 15px;
            font-size: 14px;
        }
        .link a {
            color: #1a5e1a;
            font-weight: bold;
            text-decoration: none;
        }
        .error {
            color: red;
            background: #ffe0e0;
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
        }
        .success {
            color: green;
            background: #e0ffe0;
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="box">
    <h2>🌿 Highway Medico</h2>
    <p>Create New Account</p>

    {% if messages %}
        {% for msg in messages %}
            <p class="{% if msg.tags == 'error' %}error{% else %}success{% endif %}">{{ msg }}</p>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <input type="text" name="username" placeholder="Username - Ex: raghav" required>

        <input type="email" name="email" placeholder="Email - Ex: raghav@gmail.com" required>

        <input type="password" name="password" placeholder="Password" required>

        <input type="password" name="confirm_password" placeholder="Confirm Password" required>

        <button type="submit">Register</button>
    </form>

    <p class="link">Already have account? <a href="/login/">Login Here</a></p>
    <p class="link"><a href="/">← Back to Home</a></p>
</div>

</body>
</html>
